<title>Schrijfkamer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Pinyon+Script&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: donkere schrijfkamer — vaste kolom links (boek + navigatie), rechts per onderdeel een banner met titel en daaronder het werkblad; op telefoon stapelt alles. */
:root{
  --paper:#14110E; --surface:#1D1915; --sunk:#0E0C0A; --ink:#ECE3D2; --muted:#B4A792; --faint:#857969; --line:#362D26;
  --pencil:#C9A45C; --on-pencil:#1A140D; --wash:#2C241A;
  --ok:#95BB8B; --warn:#DE9A52; --bad:#E3826F; --scrim:rgb(0 0 0 / .62);
  --banner-a:#2C2219; --banner-b:#0F0C09; --glow:rgb(214 168 92 / .28); --ember:rgb(130 66 28 / .42);
  --f-ui:"Schibsted Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-ms:"Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-script:"Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --f-num:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none !important}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px));
  padding-block:22px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand .mark{font-family:var(--f-ms);font-size:26px;line-height:1;color:var(--pencil);font-weight:500}
.lbl{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-bottom:6px}
.bookpick{display:flex;gap:6px}
.bookpick select{flex:1;min-width:0}
nav.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:transparent;text-align:left;
  padding:7px 10px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.nav .cnt{font-family:var(--f-num);font-size:11px;color:var(--faint)}
.sidefoot{margin-top:auto;display:grid;gap:12px}
.sync{font-size:12px;color:var(--muted);display:grid;gap:4px}
.sync .row{display:flex;align-items:center;gap:7px}
.sync .led{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.sync .led.busy{background:var(--warn)}
.sync .led.err{background:var(--bad)}
.sync .where{color:var(--faint)}
main{min-width:0;padding-block:26px 72px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:550;font-size:14px;white-space:nowrap;line-height:1.3}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--pencil);color:var(--on-pencil);border-color:transparent}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:var(--surface);border-color:transparent}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.icon{padding:6px 9px}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;line-height:1.45}
textarea{resize:vertical}
textarea.grow{resize:none;overflow:hidden}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pencil);box-shadow:0 0 0 3px var(--wash)}
::placeholder{color:var(--faint)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{grid-column:1/-1;display:grid;gap:5px;min-width:0}
.field.half{grid-column:auto}
.field>label{font-size:13px;font-weight:600}
.hint{font-size:12.5px;color:var(--muted);margin-top:-3px}

/* ---------- common blocks ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--pencil);margin-bottom:6px}
.vh h1{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4.4vw,46px);line-height:1.02;letter-spacing:0}
.vh .sub{color:var(--muted);margin-top:8px;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:14px;font-weight:650;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h2 .aside{font-weight:500;color:var(--faint);font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
.st-0,.st-1{color:var(--faint)} .st-2,.st-3{color:var(--warn)} .st-4{color:var(--pencil)} .st-5{color:var(--ok)}
.meter{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter>i{display:block;height:100%;background:var(--pencil);border-radius:inherit}
.meter.ok>i{background:var(--ok)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.empty strong{color:var(--ink);font-family:var(--f-ms);font-size:20px;font-weight:500}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- overzicht ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{display:grid;gap:8px;align-content:start}
.stat .k{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.stat .v{font-family:var(--f-num);font-size:28px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.stat .v small{font-size:13px;color:var(--faint);font-weight:400;letter-spacing:0}
.stat .s{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.resume blockquote{margin:0 0 14px;font-family:var(--f-ms);font-size:17px;line-height:1.6;color:var(--muted);border-left:2px solid var(--line);padding-left:14px}
.resume h3{font-family:var(--f-ms);font-weight:500;font-size:22px;margin-bottom:4px}
.chart .plot{position:relative;height:120px;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;align-items:end;border-bottom:1px solid var(--line)}
.chart .bar{background:var(--wash);border-radius:3px 3px 0 0;min-height:2px}
.chart .bar.met{background:var(--pencil)}
.chart .bar.today{box-shadow:inset 0 0 0 1.5px var(--pencil)}
.chart .goal{position:absolute;left:0;right:0;border-top:1px dashed var(--faint);pointer-events:none}
.chart .goal span{position:absolute;right:0;top:-18px;font-size:11px;color:var(--faint);background:var(--surface);padding-left:4px}
.chart .xl{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:6px;font-size:11px;color:var(--faint);text-align:center;margin-top:6px}
.pipe{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-bottom:12px;gap:2px}
.pipe i{display:block;height:100%;background:currentColor}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend .li{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center}
.legend .li .n{font-family:var(--f-num);font-size:12.5px;color:var(--muted);text-align:right;min-width:2ch}
.legend .li .w{font-family:var(--f-num);font-size:12px;color:var(--faint);text-align:right;min-width:7ch}
.cast{display:flex;flex-wrap:wrap;gap:8px}
.mono{width:34px;height:34px;border-radius:50%;background:var(--wash);color:var(--pencil);display:grid;place-items:center;font-family:var(--f-ms);font-size:17px;font-weight:600;flex:none}
.castbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px 3px 3px;cursor:pointer;font-size:13.5px}
.castbtn .mono{width:28px;height:28px;font-size:14px}
.idea{font-family:var(--f-ms);font-size:17px;line-height:1.55}

/* ---------- manuscript ---------- */
.ms{display:grid;grid-template-columns:240px minmax(0,1fr);gap:22px;align-items:start}
.chlist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100dvh - 40px);overflow:auto;display:grid;gap:10px}
.chlist ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.chi{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:8px;align-items:center;text-align:left;border:0;background:transparent;
  padding:7px 8px;border-radius:7px;cursor:pointer}
.chi:hover{background:var(--sunk)}
.chi.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.chi .chn{font-family:var(--f-num);font-size:12px;color:var(--faint)}
.chi .cht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.chi .chw{font-family:var(--f-num);font-size:11.5px;color:var(--faint)}
.chsum{font-size:12.5px;color:var(--muted);padding:8px;border-top:1px solid var(--line)}
.edtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.edtools select,.edtools input{width:auto;padding:6px 8px;font-size:13.5px}
.edtools .goal-in{width:96px}
.edtools label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,5vw,56px) clamp(16px,6vw,72px) 0;transition:border-color .2s}
.sheet:focus-within{border-color:var(--faint)}
.sheet .inner{max-width:68ch;margin-inline:auto}
.ch-title{font-family:var(--f-ms);font-size:clamp(26px,3.4vw,34px);font-weight:500;border:0 !important;background:transparent !important;width:100%;padding:0 !important;box-shadow:none !important;letter-spacing:-.01em}
.syn{border:0 !important;background:var(--paper) !important;box-shadow:none !important;font-size:14px;color:var(--muted);margin-top:14px;border-radius:8px}
.synhr{border:0;border-top:1px solid var(--line);margin:22px 0}
textarea.prose{font-family:var(--f-ms);font-size:19px;line-height:1.75;border:0;background:transparent;width:100%;min-height:55vh;padding:0 0 40px;box-shadow:none !important;hyphens:auto}
textarea.prose:focus{box-shadow:none}
.edfoot{position:sticky;bottom:0;margin-inline:calc(-1 * clamp(16px,6vw,72px));padding:10px clamp(16px,6vw,72px) calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--surface);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;font-size:12.5px;color:var(--muted)}
.edfoot b{font-family:var(--f-num);font-weight:500;color:var(--ink)}
.edfoot .meter{width:90px}
.sprint{color:var(--pencil);font-family:var(--f-num)}
body.focus .scenes,body.focus .side,body.focus .chlist,body.focus .edtools .meta,body.focus .syn,body.focus .synhr,body.focus .ms-head{display:none}
body.focus .app{grid-template-columns:minmax(0,1fr)}
.rwgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(24px,3vw,48px);align-items:start}
.sheet.rw .inner{max-width:none}
.rwref{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding:0 6px 24px 0;margin-bottom:24px;scrollbar-width:thin}
.rwhead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;position:sticky;top:0;background:var(--surface);padding:2px 0 10px;z-index:1}
.rwhead .lbl{margin:0}
.rwhead #rw-ver{flex:1 1 100%}
.rwedit{display:flex;align-items:center;gap:10px;margin:0 0 10px}.rwedit select{flex:1;min-width:0}
body.focus .rwedit{display:none}
.rwhead #rwcount{flex:1 1 100%;order:9}
.rwref .meter{display:block;margin:0 0 12px}
.rwchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rwtips{font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 14px}
.rwtips summary{cursor:pointer;font-weight:600;color:var(--ink)}
.rwtips ol{margin:8px 0 2px;padding-left:18px;display:grid;gap:5px}
.rwp{font-family:var(--f-ms);font-size:15.5px;line-height:1.65;color:var(--muted);margin:0 0 4px;padding:8px 10px 8px 12px;border-left:2px solid transparent;border-radius:0 8px 8px 0;cursor:pointer;transition:background .15s,color .15s}
.rwp:hover{background:var(--sunk);border-left-color:var(--line)}
.rwp.done{color:var(--faint);opacity:.55;border-left-color:var(--ok)}
.rwp.done::before{content:'✓ ';color:var(--ok);font-family:var(--f-ui,inherit);font-size:12px}
.rwp em{color:var(--ink);font-style:italic}.rwp.done em{color:inherit}
.rwwho{display:block;font-family:var(--f-num);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--pencil)}
.chi.rwing .chn{color:var(--pencil)}
.chbeats{margin:6px 0 10px;font-size:13.5px;line-height:1.5}.chbeats p{margin:0 0 6px}
body.focus .chbeats{display:none}
body.focus .rwhead .btn,body.focus .rwchips{display:none}
body.focus .ms{grid-template-columns:minmax(0,1fr)}
body.focus .sheet{border-color:transparent;background:transparent}
body.focus .edfoot{background:var(--paper)}

/* ---------- plot ---------- */
.tl{position:relative;height:38px;background:var(--sunk);border-radius:6px;overflow:hidden;margin-bottom:10px}
.tl .seg{position:absolute;top:0;bottom:0;background:var(--wash);border-right:2px solid var(--surface)}
.tl .seg:nth-child(even){background:color-mix(in srgb,var(--pencil) 30%,var(--wash))}
.tl .tick{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--pencil)}
.tl .tick b{position:absolute;top:50%;left:-9px;transform:translateY(-50%);width:18px;height:18px;border-radius:50%;background:var(--pencil);color:var(--on-pencil);font:600 10px/18px var(--f-num);text-align:center}
.tlx{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);font-family:var(--f-num)}
.beats{display:grid;gap:10px}
.beat{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:start}
.beat .pct{font-family:var(--f-num);font-size:13px;color:var(--pencil);padding-top:9px;text-align:right}
.beat .bn{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.beat .bn input.name{font-weight:650;border-color:transparent;background:transparent;padding-inline:0;flex:1;min-width:160px}
.beat .bn input.name:focus{padding-inline:8px}
.beat .bn input.pctin{width:72px}
.beat .bh{font-size:13px;color:var(--muted);margin:2px 0 8px}
.beat .bm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}
.beat .bm select{width:auto;max-width:100%;padding:5px 8px;font-size:13px}
.chip.late{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.good{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.confirm{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:var(--r);padding:14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* ---------- personages / wereld ---------- */
.ent{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;align-items:start}
.entlist{display:grid;gap:8px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;cursor:pointer}
.card:hover{border-color:var(--faint)}
.card.on{border-color:var(--pencil);box-shadow:0 0 0 3px var(--wash)}
.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .d{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .mono.sq{border-radius:8px}
.entform .formhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.entform .formhead .mono{width:46px;height:46px;font-size:22px}
.entform .formhead h2{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0;display:block}
.appear{font-size:12.5px;color:var(--muted);margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- ideeën ---------- */
.capture{display:grid;grid-template-columns:minmax(0,1fr) 160px auto;gap:8px;align-items:start;margin-bottom:14px}
.capture .src{grid-column:1/2}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notes{columns:3 250px;column-gap:14px}
.note{break-inside:avoid;margin-bottom:14px;display:grid;gap:8px;padding:14px}
.note.done{opacity:.6}
.note .nh{display:flex;align-items:center;gap:8px}
.note textarea{border:0;background:transparent;padding:0;font-family:var(--f-ms);font-size:16.5px;line-height:1.5;box-shadow:none !important}
.note .src{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.note .src a{color:var(--pencil)}
.tick{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);cursor:pointer}
.frlist{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.frlist li{padding:8px 12px;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.frlist li:first-child{border-top:0}
.frlist b{display:flex;gap:8px;font-weight:600;color:var(--ink)}.frlist b span{margin-left:auto;color:var(--faint);font-weight:400;font-size:12.5px}
.frlist mark{background:var(--wash);color:var(--pencil);border-radius:3px;padding:0 2px}
.frlist .ctx{color:var(--muted)}
.tick input{accent-color:var(--pencil)}

/* ---------- voortgang ---------- */
.stats.six{grid-template-columns:repeat(6,minmax(0,1fr))}
.hmwrap{overflow-x:auto;padding-bottom:4px}
.hm{display:grid;grid-template-columns:24px repeat(18,14px);grid-template-rows:16px repeat(7,14px);gap:3px;font-size:10.5px;color:var(--faint);width:max-content}
.hm .ml{grid-row:1;white-space:nowrap;overflow:visible}
.hm .dl{grid-column:1;line-height:14px}
.hc{width:14px;height:14px;border-radius:3px;background:var(--sunk)}
.hc.c1{background:color-mix(in srgb,var(--pencil) 28%,var(--sunk))}
.hc.c2{background:color-mix(in srgb,var(--pencil) 52%,var(--sunk))}

function localStore(){
  const KEY='schrijfkamer:data:v1';
  let docs={}; try{ docs=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){ docs={}; }
  const subs=new Map();
  const parent=p=>p.slice(0,p.lastIndexOf('/'));
  const list=col=>Object.keys(docs).filter(p=>parent(p)===col).map(p=>({id:p.slice(col.length+1),data:docs[p]}));
  let warned=false;
  const persist=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(docs)); }catch(e){ if(!warned){ warned=true; toast('De opslag van deze browser is vol of geblokkeerd. Exporteer je manuscript via Boek.'); } } };
  const notify=col=>{ (subs.get(col)||new Set()).forEach(cb=>cb(list(col))); };
  return {
    listen(col,cb){ if(!subs.has(col)) subs.set(col,new Set()); subs.get(col).add(cb); setTimeout(()=>cb(list(col)),0); return ()=>subs.get(col)?.delete(cb); },
    async set(p,d){ docs[p]=JSON.parse(JSON.stringify(d)); persist(); notify(parent(p)); },
    async del(p){ delete docs[p]; persist(); notify(parent(p)); },
    async getAll(col){ return list(col); },
    async get(p){ return docs[p]?JSON.parse(JSON.stringify(docs[p])):null; },
  };
}

function dbStore(db){
  const retry=async fn=>{ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*700)); return fn(); } throw e; } };
  return {
    listen(col,cb){
      let un=null, dead=false;
      const go=()=>{ un=db.collection(col).onSnapshot(
        s=>cb(s.docs.map(d=>({id:d.id,data:d.data()}))),
        e=>{ if(dead) return; if(e&&e.code==='unavailable') setTimeout(()=>{ if(!dead) go(); },3000); else storeError(e); }); };
      go();
      return ()=>{ dead=true; un&&un(); };
    },
    set:(p,d)=>retry(()=>db.doc(p).set(d)),
    async get(p){ const s=await retry(()=>db.doc(p).get()); return s.exists?s.data():null; },
    del:p=>retry(()=>db.doc(p).delete()),
    async getAll(col){ const s=await retry(()=>db.collection(col).get()); return s.docs.map(d=>({id:d.id,data:d.data()})); },
  };
}

/* schrijfwachtrij: één schrijfactie per document tegelijk, invoer gebundeld */
const pending=new Map(), timers=new Map(), busy=new Set(), again=new Set(), tomb=new Set();
let saveErr=false;
function queue(path,obj,delay=900){
  pending.set(path,obj); clearTimeout(timers.get(path));
  timers.set(path,setTimeout(()=>flush(path),delay)); syncState();
}
async function flush(path){
  clearTimeout(timers.get(path)); timers.delete(path);
  const obj=pending.get(path); if(!obj) return;
  if(busy.has(path)){ again.add(path); return; }
  busy.add(path); syncState();
  const json=JSON.stringify(obj);
  try{
    await store.set(path,JSON.parse(json));
    saveErr=false;
    if(JSON.stringify(pending.get(path))===json) pending.delete(path);
  }catch(e){ storeError(e,path); }
  finally{
    busy.delete(path);
    if(again.has(path)){ again.delete(path); if(pending.has(path)) flush(path); }
    syncState();
  }
}
function flushAll(){ [...pending.keys()].forEach(flush); }
async function writeNow(path,obj){ pending.set(path,obj); await flush(path); }
async function removeDoc(path){
  pending.delete(path); clearTimeout(timers.get(path)); tomb.add(path);
  try{ await store.del(path); }catch(e){ storeError(e); }
}
const ERR = {
  quota_exceeded:'Je opslag is vol. Verwijder oude notities of boeken om verder te kunnen bewaren.',
  invalid_argument:'Dit kon niet worden opgeslagen. Een hoofdstuk mag hooguit zo’n 40.000 woorden bevatten; splits het op.',
  revoked:'Opslaan is niet meer beschikbaar in deze weergave. Kopieer je tekst voor de zekerheid.',
};
function storeError(e,path){
  const c=e&&e.code; saveErr=true; syncState();
  if(path && (c==='resource_exhausted'||c==='unavailable')){ timers.set(path,setTimeout(()=>flush(path),5000)); return; }
  toast(ERR[c]||'Opslaan is mislukt. Je tekst staat nog op je scherm; kopieer hem voor de zekerheid.');
}
function mergeRows(rows,col){
  const out=[], seen=new Set();
  for(const r of rows){
    const p=col+'/'+r.id; if(tomb.has(p)) continue; seen.add(p);
    out.push(pending.get(p)||Object.assign(structuredClone(r.data||{}),{id:r.id}));
  }
  for(const [p,o] of pending){ if(p.startsWith(col+'/') && !p.slice(col.length+1).includes('/') && !seen.has(p)) out.push(o); }
  return out;
}

function streaks(log){
  let cur=0; const d=startOfToday();
  if(!(log[dk(d)]>0)) d.setDate(d.getDate()-1);
  while(log[dk(d)]>0){ cur++; d.setDate(d.getDate()-1); }
  const keys=Object.keys(log).filter(k=>log[k]>0).sort();
  let best=0, run=0, prev=null;
  for(const k of keys){
    const t=new Date(k+'T12:00:00');
    run = prev && Math.round((t-prev)/864e5)===1 ? run+1 : 1;
    best=Math.max(best,run); prev=t;
  }
  return {cur,best};
}
function deadlineInfo(b,total){
  if(!b.deadline) return null;
  const days=Math.ceil((new Date(b.deadline+'T00:00:00')-startOfToday())/864e5);
  const rest=Math.max(0,(b.targetWords||0)-total);
  return {days,rest,perDay:days>0?Math.ceil(rest/days):rest};
}
function bars14(log,goal){
  const t=startOfToday(), days=[];
  for(let i=13;i>=0;i--){ const d=new Date(t); d.setDate(t.getDate()-i); days.push([d,log[dk(d)]||0]); }
  const max=Math.max(goal||0,...days.map(x=>x[1]),1)*1.08;
  return `<div class="chart" role="img" aria-label="Woorden per dag, laatste 14 dagen">
    <div class="plot">
      ${goal?`<div class="goal" style="bottom:${goal/max*100}%"><span>doel ${nf(goal)}</span></div>`:''}
      ${days.map(([d,v],i)=>`<div class="bar ${goal&&v>=goal?'met':''} ${i===13?'today':''}" style="height:${v/max*100}%" title="${esc(DF.format(d))}: ${nf(v)} woorden"></div>`).join('')}
    </div>
    <div class="xl">${days.map(([d],i)=>`<span>${i===13?'nu':WD[(d.getDay()+6)%7]}</span>`).join('')}</div>
  </div>`;
}

/* ---------- versies: een eerdere tekst als referentie naast je blad ---------- */
// c.versions = [{id, label, at, text}] (oud → nieuw), c.rwRef = getoonde versie, c.rwDone = {versie-id: [passages]}.
const RW_TIPS=[
  'Kies per scène één perspectief en blijf erin. Zet “you” om naar de naam of “hij/zij” van je personage.',
  'Schrijf je in een andere taal dan de chat? Vertaal niet zin per zin: lees de passage, kijk weg, en vertel ze opnieuw in je eigen woorden.',
  'Labels zoals [Rynara] verdwijnen: laat uit de dialoog en de handeling blijken wie spreekt.',
  'Acties tussen *sterretjes* worden gewone zinnen. Kies de sterkste, niet allemaal.',
  'Een chat vertelt veel. Toon meer: gevoel via lichaam, handeling en wat iemand níét zegt.',
  'Schrap herhalingen, uitleg die de lezer al kent en alles wat buiten het verhaal valt.',
  'Vat lang heen-en-weer samen; bewaar de beste regels bijna letterlijk.',
  'Klik een passage aan zodra je ze verwerkt hebt. Zo zie je waar je bent.',
];
const vDate=t=>new Date(t).toLocaleString('nl-BE',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const hasVersions=c=>!!(c&&Array.isArray(c.versions)&&c.versions.length);
function rwRefVersion(c){ const v=c.versions||[]; return v.find(x=>x.id===c.rwRef)||v[0]; }
function rwParts(src){
  const t=String(src||'').replace(/\r/g,'').trim(); if(!t) return [];
  let parts=t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  if(parts.length<4){
    // geen witregels: per regel, met een los naamlabel samen met de regel erna
    const lines=t.split('\n').map(x=>x.trim()).filter(Boolean); parts=[];
    for(let k=0;k<lines.length;k++){
      if(/^\[[^\]]{1,40}\]$/.test(lines[k])&&k+1<lines.length){ parts.push(lines[k]+'\n'+lines[k+1]); k++; } else parts.push(lines[k]);
    }
  }
  return parts;
}
function rwFmt(p){
  return p.split('\n').map(l=>{
    const who=l.match(/^\[([^\]]{1,40})\]\s*$/); if(who) return `<span class="rwwho">${esc(who[1])}</span>`;
    return esc(l).replace(/\*\*([^*\n]+)\*\*/g,'$1').replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  }).join('<br>');
}
function rwProgress(c,v){
  const n=rwParts(v.text).length, d=((c.rwDone||{})[v.id]||[]).filter(k=>k<n).length;
  return {n,d,pct:n?Math.round(d/n*100):0};
}
const rwCountText=(v,pr)=>`${nf(countWords(v.text))} woorden · ${pr.d} van ${pr.n} passages verwerkt`;
function rwRefHtml(c){
  const v=rwRefVersion(c), parts=rwParts(v.text), done=new Set((c.rwDone||{})[v.id]||[]), pr=rwProgress(c,v);
  // Volledige naam, of de voornaam als die geen lidwoord of titel is ("The grey enforcer" telt niet als "The").
  const RW_STOP=/^(the|a|an|de|het|een|mr|mrs|ms|dr|sir|lady|lord|old|young)$/i;
  const nameRe=t=>new RegExp(`(?<![\\p{L}])${t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}(?![\\p{L}])`,'u');
  const who=S.characters.filter(x=>{ const full=String(x.name||'').trim(), f=full.split(/\s+/)[0];
    return full.length>1&&(nameRe(full).test(v.text)||(f.length>2&&!RW_STOP.test(f)&&nameRe(f).test(v.text))); });
  const vs=[...c.versions].reverse();
  return `<aside class="rwref" aria-label="Eerdere versie als referentie">
    <div class="rwhead">
      <label for="rw-ver" class="lbl" style="margin:0">Vergelijk met</label>
      <select id="rw-ver" aria-label="Vergelijk met" style="max-width:100%">${vs.map(x=>`<option value="${esc(x.id)}" ${x.id===v.id?'selected':''}>${esc(x.label)} · ${vDate(x.at)} · ${nf(countWords(x.text))} w</option>`).join('')}</select>
      <span class="faint" style="font-size:12.5px" id="rwcount">${rwCountText(v,pr)}</span><span class="spacer"></span>
      <button class="btn ghost sm" data-act="rwSnap" title="Bewaar je huidige tekst als versie, zodat je er later op kunt terugvallen">Bewaar versie</button>
      <button class="btn ghost sm" data-act="rwRestore" title="Zet deze versie rechts, als de tekst waaraan je werkt. Je huidige tekst wordt eerst bewaard.">Zet rechts</button>
      <button class="btn ghost sm" data-act="rwDelVer" data-confirm="Versie verwijderen? Klik opnieuw" title="Verwijder deze versie">×</button></div>
    <span class="meter ${pr.pct===100?'ok':''}" id="rwmeter"><i style="width:${pr.pct}%"></i></span>
    ${who.length?`<div class="rwchips">${who.map(x=>`<span class="chip" title="${esc(cut([x.role,x.appearance,x.personality].filter(Boolean).join(' · '),260))}">${esc(x.name)}</span>`).join('')}</div>`:''}
    <details class="rwtips" ${prefs.rwTips===false?'':'open'}><summary>Tips: van chat naar proza</summary><ol>${RW_TIPS.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></details>
    <div class="rwps">${parts.length?parts.map((p,k)=>`<p class="rwp ${done.has(k)?'done':''}" data-act="rwTick" data-k="${k}">${rwFmt(p)}</p>`).join(''):'<p class="faint">Deze versie is leeg.</p>'}</div>
  </aside>`;
}
function rwChapter(){ return S.chapters.find(c=>c.id===S.sel.chapters); }
// Rechts: kies aan welke tekst je werkt. Je huidige tekst wordt eerst als versie bewaard, dus er gaat niets verloren.
function rwEditHtml(c){
  const base=(c.versions||[]).find(x=>x.id===c.rwBase), vs=[...c.versions].reverse();
  return `<div class="rwedit"><label for="rw-edit" class="lbl" style="margin:0">Werk aan</label>
    <select id="rw-edit" aria-label="Werk aan">
      <option value="" selected>Huidige tekst · ${nf(c.words||0)} w${base?` · gebaseerd op ${esc(base.label)}`:''}</option>
      ${vs.map(x=>`<option value="${esc(x.id)}">${esc(x.label)} · ${vDate(x.at)} · ${nf(countWords(x.text))} w</option>`).join('')}
    </select></div>`;
}
function rwLoad(id){
  const c=rwChapter(); if(!hasVersions(c)) return;
  const v=c.versions.find(x=>x.id===id); if(!v) return;
  const cur=(c.text||'').trim();
  let kept=null;
  if(cur&&!c.versions.some(x=>x.text===c.text)){ kept=addVersion(c,c.text,`Tekst van ${vDate(Date.now())}`); if(!kept){ renderMain(); return; } }
  c.text=v.text; c.words=countWords(c.text); c.rwBase=v.id; c.updated=Date.now();
  saveEnt('chapters',c,0); render(); $('#ch-text')?.focus();
  toast(kept?`“${v.label}” staat nu rechts. Je vorige tekst is bewaard als “${kept.label}”.`:`“${v.label}” staat nu rechts.`);
}
// Bewaart een tekst als nieuwe versie. Geeft false als het hoofdstuk te groot zou worden om veilig op te slaan.
function addVersion(c,text,label){
  const v={id:newId(),label,at:Date.now(),text:String(text||'')};
  const size=JSON.stringify(c).length+v.text.length;
  if(size>800000){ toast('Er passen geen versies meer bij dit hoofdstuk. Verwijder eerst een oude versie.'); return null; }
  c.versions=[...(c.versions||[]),v]; return v;
}
function rwStart(mode){
  const c=rwChapter(); if(!c||!(c.text||'').trim()) return;
  const v=addVersion(c,c.text,hasVersions(c)?`Versie ${c.versions.length+1}`:'Origineel'); if(!v) return;
  c.rwRef=v.id;
  if(mode==='blank'){ c.text=''; c.words=0; }
  c.updated=Date.now(); saveEnt('chapters',c,0); prefs.rwShow=true; savePrefs(); renderMain(); $('#ch-text')?.focus();
  toast(mode==='blank'?`“${v.label}” staat ernaast. Je begint met een leeg blad.`:`“${v.label}” staat ernaast. Je bewerkt een kopie.`);
}
function rwSnap(){
  const c=rwChapter(); if(!c) return;
  const last=(c.versions||[])[c.versions.length-1];
  if(!(c.text||'').trim()){ toast('Je huidige tekst is leeg; er valt niets te bewaren.'); return; }
  if(last&&last.text===c.text){ toast('Deze tekst is al als versie bewaard.'); return; }
  const v=addVersion(c,c.text,`Versie ${c.versions.length+1}`); if(!v) return;
  saveEnt('chapters',c,0); renderMain(); toast(`Bewaard als “${v.label}”`);
}
function rwTick(k,el){
  const c=rwChapter(); if(!c||!hasVersions(c)) return;
  if(String(getSelection()||'').trim()) return; // tekst selecteren om te kopiëren is geen aanvinken
  const v=rwRefVersion(c), map=Object.assign({},c.rwDone||{}), set=new Set(map[v.id]||[]);
  set.has(k)?set.delete(k):set.add(k);
  map[v.id]=[...set].sort((a,b)=>a-b); c.rwDone=map; saveEnt('chapters',c,600);
  el.classList.toggle('done',set.has(k));
  const pr=rwProgress(c,v), cnt=$('#rwcount'), m=$('#rwmeter');
  if(cnt) cnt.textContent=rwCountText(v,pr);
  if(m){ m.firstElementChild.style.width=pr.pct+'%'; m.classList.toggle('ok',pr.pct===100); }
}
function rwRestore(){
  const c=rwChapter(); if(!hasVersions(c)) return;
  const v=rwRefVersion(c);
  if((c.text||'').trim()&&c.text!==v.text&&!c.versions.some(x=>x.text===c.text)){
    if(!addVersion(c,c.text,`Vóór terugzetten`)) return;
  }
  c.text=v.text; c.words=countWords(c.text); c.rwBase=v.id; c.updated=Date.now();
  saveEnt('chapters',c,0); render(); toast(`“${v.label}” staat nu rechts. Niets is verloren.`);
}
function rwDelVer(){
  const c=rwChapter(); if(!hasVersions(c)) return;
  const v=rwRefVersion(c);
  c.versions=c.versions.filter(x=>x!==v);
  if(c.rwDone){ const m=Object.assign({},c.rwDone); delete m[v.id]; c.rwDone=m; }
  c.rwRef=(c.versions[0]||{}).id||null;
  saveEnt('chapters',c,0); render(); toast(`“${v.label}” verwijderd`);
}

function chBeatsHtml(c){
  const b=book(), all=[...(b.beats||[])].sort((x,y)=>(x.pct||0)-(y.pct||0)), mine=all.filter(x=>x.chapterId===c.id);
  if(!mine.length) return '';
  return `<div class="chbeats">${mine.map(x=>`<p><span class="lbl" style="margin:0">Plotmoment ${all.indexOf(x)+1}</span> <b>${esc(x.name)}</b>${x.hint?` <span class="muted">· ${esc(x.hint)}</span>`:''}${x.notes?`<br><span class="faint">Jouw plan: ${esc(cut(x.notes,220))}</span>`:''}</p>`).join('')}</div>`;
}
function scenesHtml(c){
  const sc=c.scenes||[], done=sc.filter(x=>x.done).length;
  return `<details class="scenes" ${S.scenesOpen?'open':''}><summary>Scènes <span class="faint" style="font-weight:400">${sc.length?`${done} van ${sc.length} geschreven`:'nog geen'}</span></summary>
    <ol class="scl">${sc.map((x,i)=>`<li class="sc"><input type="checkbox" aria-label="Scène ${i+1} geschreven" ${x.done?'checked':''} data-bind="scene:${esc(x.id)}:done">
      <input type="text" aria-label="Scène ${i+1}" placeholder="Wat gebeurt er in deze scène?" value="${esc(x.title)}" data-bind="scene:${esc(x.id)}:title">
      <select aria-label="Plek" data-bind="scene:${esc(x.id)}:place"><option value="">Plek</option>${S.places.map(p=>`<option value="${esc(p.id)}" ${p.id===x.place?'selected':''}>${esc(p.name||'Naamloos')}</option>`).join('')}</select>
      <select aria-label="Perspectief" data-bind="scene:${esc(x.id)}:pov"><option value="">Perspectief</option>${S.characters.map(p=>`<option value="${esc(p.id)}" ${p.id===x.pov?'selected':''}>${esc(p.name||'Naamloos')}</option>`).join('')}</select>
      <button class="btn ghost sm" data-act="delScene" data-id="${esc(x.id)}" aria-label="Verwijder scène">×</button></li>`).join('')}</ol>
    <button class="btn sm" data-act="addScene">+ Scène</button></details>`;
}
function liveChapter(c){
  const total=totalWords();
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('lw',nf(c.words)); set('lp',nf(Math.max(1,Math.ceil((c.words||0)/WORDS_PER_PAGE)))); set('lt',nf(total)); set('ltd',nf(todayWords()));
  const m=$('#lgm'); if(m&&c.goal){ m.firstElementChild.style.width=Math.min(100,c.words/c.goal*100)+'%'; m.classList.toggle('ok',c.words>=c.goal); }
  document.querySelectorAll(`[data-chw="${CSS.escape(c.id)}"]`).forEach(e=>e.textContent=nf(c.words));
  tickSprint();
}
function onChapterText(c,v,el){
  const prev=c.words||0;
  c.text=v; c.words=countWords(v); c.updated=Date.now();
  const d=c.words-prev;
  // grote sprongen (plakken, importeren, alles wissen) tellen niet als geschreven woorden
  if(d!==0 && Math.abs(d)<=300){
    const b=book(); b.log=b.log||{}; const k=todayKey();
    b.log[k]=Math.max(0,(b.log[k]||0)+d); saveBook(b,1500);
    const ss=S.session;
    if(ss && !ss.end && ss.bookId===S.activeId){
      ss.words=Math.max(0,ss.words+d); if(!ss.chapters.includes(c.id)) ss.chapters.push(c.id); storeSession(); tickSession();
    }
  }
  if(d>300) toast(`Je plakte ${nf(d)} woorden.`,{label:'Tel als vandaag geschreven',act:'countPaste',v:d});
  if(v.length>230000 && !c._warned){ c._warned=true; toast('Dit hoofdstuk wordt erg lang. Splits het op om veilig te kunnen blijven bewaren.'); }
  saveEnt('chapters',c,1000);
  liveChapter(c);
}
function addChapter(){
  const max=S.chapters.reduce((a,c)=>Math.max(a,c.order??0),0);
  const c={id:newId(),title:'',status:'Idee',pov:'',goal:null,synopsis:'',text:'',words:0,order:max+1,created:Date.now(),updated:Date.now()};
  S.chapters.push(c); saveEnt('chapters',c,0);
  S.sel.chapters=c.id; S.view='manuscript'; prefs.view='manuscript'; savePrefs();
  render(); scrollTo(0,0); $('#ch-title')?.focus();
}
function moveChapter(dir){
  const chs=S.chapters, i=chs.findIndex(c=>c.id===S.sel.chapters), j=i+dir;
  if(i<0||j<0||j>=chs.length) return;
  [chs[i],chs[j]]=[chs[j],chs[i]];
  chs.forEach((c,n)=>{ if(c.order!==n+1){ c.order=n+1; saveEnt('chapters',c,200); } });
  renderMain();
}

/* sprint */
let sprintTimer=null;
function toggleSprint(){
  if(S.sprint){ endSprint(false); return; }
  S.sprint={end:Date.now()+25*60000,start:todayWords()};
  sprintTimer=setInterval(tickSprint,1000); tickSprint();
  const b=$('#sprintBtn'); if(b) b.textContent='Stop sprint';
}
function endSprint(done){
  const n=todayWords()-(S.sprint?.start||0);
  clearInterval(sprintTimer); sprintTimer=null; S.sprint=null;
  toast(done?`Sprint klaar: ${nf(Math.max(0,n))} woorden in 25 minuten.`:`Sprint gestopt: ${nf(Math.max(0,n))} woorden.`);
  const b=$('#sprintBtn'); if(b) b.textContent='Sprint 25 min';
  const e=$('#sprint'); if(e) e.textContent='';
}
function tickSprint(){
  if(!S.sprint) return;
  const left=S.sprint.end-Date.now();
  if(left<=0){ endSprint(true); return; }
  const e=$('#sprint'); if(!e) return;
  const m=Math.floor(left/60000), s=Math.floor(left/1000)%60;
  e.textContent=`Sprint ${m}:${String(s).padStart(2,'0')} · +${nf(Math.max(0,todayWords()-S.sprint.start))}`;
}

/* ---------- plot ---------- */

    return `<div class="acth"><h3>${A[0]}<span>${A[2]}–${A[3]}%</span></h3><p>${A[1]}</p></div>`; };
  let acc=0; const pos={};
  S.chapters.forEach((c,n)=>{ pos[c.id]={start:acc,n:n+1,w:c.words||0}; acc+=c.words||0; });
  return `
  <header class="vh"><div><p class="eyebrow">Plot</p><h1>Structuur van je verhaal</h1>
    <p class="sub">Koppel elk moment aan een hoofdstuk. De tijdlijn toont je hoofdstukken op lengte, met de momenten op de plek waar ze volgens je doel van ${nf(target)} woorden horen.</p></div>

  </header>
  ${st.note?`<p class="muted" style="font-size:13.5px;margin:-6px 0 14px">${esc(st.note)}</p>`:''}
  ${S.chapters.length&&beats.some(x=>!x.chapterId)?`<div class="row" style="margin:-4px 0 14px"><button class="btn sm" data-act="autoLink" title="Koppel elk moment zonder hoofdstuk aan het hoofdstuk op dezelfde plek in je boek">Koppel momenten aan hoofdstukken</button>
    <span class="faint" style="font-size:12.5px">Op basis van de plaats in je boek (${S.chapters.length} hoofdstukken). Je kunt elke koppeling daarna aanpassen.</span></div>`:''}
  <section class="panel" style="margin-bottom:16px">
    <h2>Tijdlijn<span class="aside">${nf(total)} van ${nf(target)} woorden</span></h2>
    <div class="tl" aria-hidden="true">
      ${S.chapters.map(c=>`<span class="seg" style="left:${pos[c.id].start/scale*100}%;width:${(c.words||0)/scale*100}%" title="Hoofdstuk ${pos[c.id].n}: ${esc(c.title||'Zonder titel')} (${nf(c.words)} w)"></span>`).join('')}
      ${target?defs.slice(1).map(A=>`<span class="actline" style="left:${clamp(A[2]*target/scale,0,100)}%"></span>`).join(''):''}
      ${beats.map((x,n)=>`<span class="tick" style="left:${clamp((x.pct||0)*target/scale,0,99.4)}%" title="${esc(x.name)} · ${x.pct}%"><b>${n+1}</b></span>`).join('')}
    </div>
    <div class="tlx"><span>0</span><span>${nf(scale/2)}</span><span>${nf(scale)} woorden</span></div>
  </section>
  <section class="beats">
    ${beats.length?beats.map((x,n)=>{
      const c=x.chapterId&&pos[x.chapterId];
      const aim=(x.pct||0)/100*target;
      let rel='';
      if(c&&target){ const at=c.start/target*100; const diff=at-(x.pct||0);

const mkBeats=k=>STRUCTURES[k].beats.map(([name,pct,hint])=>({id:newId(),name,pct,hint,notes:'',chapterId:''}));
// Elke structuur bewaart haar eigen momenten, notities en koppelingen: wisselen gaat niets verloren.
function applyStructure(k){
  const b=book(); if(!STRUCTURES[k]||k===b.structure) return;
  const kept=Object.assign({},b.beatsBy||{}); if(b.structure) kept[b.structure]=b.beats||[];
  b.beatsBy=kept; b.structure=k; b.beats=kept[k]&&kept[k].length?kept[k]:mkBeats(k); delete b.beatsBy[k];
  S.confirmStruct=null; saveBook(b,0); renderMain();
  toast(`${STRUCTURES[k].name}: je vorige momenten blijven bewaard als je terugschakelt.`);
}
function autoLink(){
  const b=book(), N=S.chapters.length; if(!N) return; let n=0;
  (b.beats||[]).forEach(x=>{ if(x.chapterId) return; const i=Math.min(N-1,Math.floor((x.pct||0)/100*N)); x.chapterId=S.chapters[i].id; n++; });
  saveBook(b,0); renderMain(); toast(`${n} ${n===1?'moment':'momenten'} gekoppeld`);
}

/* ---------- voortgang ---------- */
function heatmap(log,goal){
  const W=18, t=startOfToday(), dow=(t.getDay()+6)%7;
  const start=new Date(t); start.setDate(t.getDate()-dow-(W-1)*7);
  const g=goal||500; let html='', lastM=-1;
  for(let w=0;w<W;w++){ const d=new Date(start); d.setDate(start.getDate()+w*7);
    if(d.getMonth()!==lastM){ html+=`<span class="ml" style="grid-column:${w+2}">${esc(MF.format(d))}</span>`; lastM=d.getMonth(); } }
  ['ma','','wo','','vr','',''].forEach((l,r)=>{ if(l) html+=`<span class="dl" style="grid-row:${r+2}">${l}</span>`; });
  for(let i=0;i<W*7;i++){
    const d=new Date(start); d.setDate(start.getDate()+i);
    const col=Math.floor(i/7)+2, row=i%7+2;
    if(d>t){ html+=`<span class="hc fut" style="grid-column:${col};grid-row:${row}"></span>`; continue; }
    const v=log[dk(d)]||0, lv=v<=0?0:v<g*.25?1:v<g*.6?2:v<g?3:4;
    html+=`<span class="hc c${lv}" style="grid-column:${col};grid-row:${row}" title="${esc(DF.format(d))}: ${nf(v)} woorden"></span>`;
  }
  return `<div class="hmwrap"><div class="hm" role="img" aria-label="Schrijfkalender, laatste 18 weken">${html}</div></div>
    <div class="hmleg">Minder <span class="hc"></span><span class="hc c1"></span><span class="hc c2"></span><span class="hc c3"></span><span class="hc c4"></span> Dagdoel gehaald</div>`;
}
function vVoortgang(){

    <div class="panel stat"><span class="k">Beste dag</span><span class="v">${nf(bestK?log[bestK]:0)}</span><span class="s">${bestK&&log[bestK]?esc(DF.format(new Date(bestK+'T12:00:00'))):'nog geen'}</span></div>

  </section>
  <section class="panel" style="margin-bottom:16px"><h2>Schrijfkalender<span class="aside">laatste 18 weken</span></h2>${heatmap(log,goal)}</section>

async function aiText(prompt,ctl,onText){
  try{ return (await sample(prompt,{signal:ctl.signal,cache:false,onText})).text; }
  catch(e){
    const c=(e&&e.code)||'upstream_error';
    if(AI_OFF.includes(c)){ sample=null; closeModal(); render(); toast('Claude is niet beschikbaar in deze weergave.'); }
    throw {code:c,msg:c==='cancelled'||AI_OFF.includes(c)?'':(AI_ERR[c]||'Er ging iets mis bij het antwoord. Probeer het opnieuw.')};
  }
}
async function runMkt(k){
  const M=S.mkt; if(M.busy||!aiOn()) return;
  const b=book(), m=b.marketing||{}, topic=MKT_TOPICS.find(x=>x[0]===k); if(!topic) return;
  const lg=BOOK_LANGS.find(x=>x[0]===bookLang(b))||BOOK_LANGS[0];
  const L=[lg[0]==='nl'?'Je bent een ervaren boekenmarketeer in het Nederlandse taalgebied (Vlaanderen en Nederland).'
      :`Je bent een ervaren boekenmarketeer voor de ${lg[2]} markt. Het boek is geschreven in het ${lg[1]}.`,'',
    '## Boek',`Titel: ${b.title||'-'}`,`Genre: ${b.genre||'-'}`,b.series?`Reeks: ${b.series}`:'',`Logline: ${cut(b.logline,600)||'-'}`,`Thema: ${cut(b.theme,300)||'-'}`,
    `Synopsis: ${cut(b.synopsis,1500)||'-'}`,`Beoogde lengte: ${b.targetWords||'?'} woorden. Fase: ${b.status||'-'}.`,''];
  const B=S.brand; if(B.name||B.tagline||B.bio) L.push('## Auteur',B.name?`Naam: ${B.name}`:'',B.tagline?`Belofte: ${B.tagline}`:'',B.bio?`Bio: ${cut(B.bio,500)}`:'','');
  const other=MKT_TOPICS.filter(([x])=>x!==k&&String(m[x]||'').trim());
  if(other.length){ L.push('## Wat al in het marketingplan staat'); other.forEach(([x,l])=>L.push(`${l}: ${cut(m[x],600)}`)); L.push(''); }
  L.push('## Opdracht',`Schrijf een eerste versie voor het onderdeel “${topic[1]}” van het marketingplan: ${topic[2]}`,
    'Concreet en afgestemd op dit boek, 4 à 8 korte punten die elk met een streepje beginnen. Geen inleiding of afsluiting, alleen de punten. Verzin geen feiten over de auteur of over bestaande titels die je niet zeker kent.',
    lg[0]==='nl'?'':`Schrijf je uitleg in het Nederlands, maar zet voorbeeldteksten voor lezers (zoals een achterflap, slogan of post) in het ${lg[1]}.`);
  M.busy=k; M.text=''; M.err=''; M.errK=null; delete M.sugg[k];
  const ctl=new AbortController(); M.ctl=ctl; refreshMkt(k);
  try{ const t=await aiText(L.filter(Boolean).join('\n'),ctl,({text})=>{ M.text=text; refreshMkt(k); }); M.sugg[k]=t.trim(); }
  catch(e){ if(e.msg){ M.err=e.msg; M.errK=k; } }
  finally{ M.busy=null; M.ctl=null; M.text=''; refreshMkt(k); }
}

function splitChapters(text){
  const H=/^\s*(?:#{1,3}\s+(.+?)|((?:hoofdstuk|chapter|deel)\s+(?:\d+|[ivxlcdm]+|een|twee|drie|vier|vijf|zes|zeven|acht|negen|tien)\b.*?))\s*#*\s*$/i;
  const out=[]; let cur=null;
  for(const ln of String(text||'').replace(/\r\n?/g,'\n').split('\n')){
    const m=ln.trim().length<120?ln.match(H):null;
    if(m){ cur={title:(m[1]||m[2]||'').replace(/^(?:hoofdstuk|chapter|deel)\s+\S+\s*[:.\-–—]?\s*/i,'').replace(/[*_]+/g,'').trim(),lines:[]}; out.push(cur); }
    else { if(!cur){ cur={title:'',lines:[]}; out.push(cur); } cur.lines.push(ln); }
  }
  return out.map(c=>({title:c.title,text:c.lines.join('\n').replace(/^\s*\n|\n\s*$/g,'').trim()})).filter(c=>c.title||c.text);
}

function chatBrief(){
  const b=book(), chs=S.chapters, total=totalWords();
  const who=id=>S.characters.find(c=>c.id===id)?.name||'', where=id=>S.places.find(p=>p.id===id)?.name||'';
  const L=[`# Achtergrond bij mijn boek “${b.title||'Naamloos boek'}”`,
    'Dit is mijn verhaalbijbel uit Schrijfkamer. Gebruik ze als vaste achtergrond bij alles wat we in deze chat doen: spreek ze niet tegen, en vraag het me als iets ontbreekt of niet klopt.',''];
  L.push('## Kern');
  if(bookLang(b)!=='nl') L.push(`- Taal van het boek: ${langName(bookLang(b))}. Schrijf romantekst en voorbeeldzinnen in die taal.`);
  if(b.series) L.push(`- Reeks: ${b.series}`);
  L.push(`- Genre: ${b.genre||'-'}`,`- Logline: ${b.logline||'-'}`,`- Thema: ${b.theme||'-'}`,`- Beoogde lengte: ${b.targetWords||'?'} woorden (nu ${total} geschreven)`,'');
  if(b.synopsis) L.push('## Synopsis',b.synopsis.trim(),'');
  const beats=[...(b.beats||[])].sort((x,y)=>(x.pct||0)-(y.pct||0));
  if(beats.length){ L.push(`## Plotstructuur: ${STRUCTURES[b.structure]?.name||'eigen structuur'}`);
    beats.forEach(x=>{ const ci=chs.findIndex(c=>c.id===x.chapterId); L.push(`- ${x.name} (rond ${x.pct}%)${ci>=0?` → hoofdstuk ${ci+1}`:''}${x.notes?`: ${x.notes.trim()}`:''}`); }); L.push(''); }
  if(chs.length){ L.push('## Hoofdstukken');
    chs.forEach((c,i)=>{ L.push(`${i+1}. ${c.title||'Zonder titel'} [${c.status||'Idee'}${c.pov?`, perspectief: ${who(c.pov)}`:''}, ${c.words||0} woorden]${c.synopsis?`: ${c.synopsis.trim()}`:''}`);
      (c.scenes||[]).forEach(sc=>L.push(`   - Scène${sc.done?' (geschreven)':''}: ${sc.title||'zonder titel'}${sc.place?` · ${where(sc.place)}`:''}${sc.pov?` · ${who(sc.pov)}`:''}`)); });
    L.push(''); }
  const sec=(o,fields)=>fields.filter(f=>f.k!=='name'&&o[f.k]).map(f=>`- ${f.l.replace(/\?$/,'')}: ${String(o[f.k]).trim()}`);
  if(S.characters.length){ L.push('## Personages'); S.characters.forEach(c=>{ L.push(`### ${c.name||'Naamloos'}`,...sec(c,CHAR_FIELDS),''); }); }
  if(S.places.length){ L.push('## Wereld'); S.places.forEach(p=>{ L.push(`### ${p.name||'Naamloos'}`,...sec(p,PLACE_FIELDS),''); }); }
  const rs=(S.research||[]).filter(r=>r.status==='Onderzocht'&&r.notes);
  if(rs.length){ L.push('## Research'); rs.forEach(r=>L.push(`- ${r.title||'Onderwerp'} (${r.category||'-'}): ${r.notes.trim()}`)); L.push(''); }
  const qs=S.notes.filter(n=>!n.done&&n.type==='Vraag'&&n.text);
  if(qs.length){ L.push('## Open vragen'); qs.forEach(n=>L.push(`- ${n.text.trim()}`)); L.push(''); }
  const ls=[...S.sessions].sort((x,y)=>(y.end||0)-(x.end||0))[0];
  const nextCh=chs.findIndex(c=>!c.words&&c.status!=='Klaar');
  if((ls&&ls.next)||nextCh>=0){ L.push('## Waar ik nu ben');
    if(nextCh>=0) L.push(`- Volgende hoofdstuk om te schrijven: ${nextCh+1}. ${chs[nextCh].title||'zonder titel'}`);
    if(ls&&ls.next) L.push(`- Mijn notitie voor de volgende keer: ${ls.next}`); }
  return L.join('\n');
}
function exportText(kind){
  const b=book(); const t=b.title||'Naamloos boek';
  if(kind==='chat') return chatBrief();
  if(kind==='txt'){
    let s=t.toUpperCase()+'\n\n';
    S.chapters.forEach((c,i)=>{ s+=`\n\nHOOFDSTUK ${i+1}${c.title?' – '+c.title.toUpperCase():''}\n\n${(c.text||'').trim()}\n`; });
    return s;
  }
  if(kind==='md'){
    let s=`# ${t}\n\n`; if(b.logline) s+=`*${b.logline}*\n\n`;
    S.chapters.forEach((c,i)=>{ s+=`## Hoofdstuk ${i+1}${c.title?': '+c.title:''}\n\n${(c.text||'').trim()}\n\n`; });
    return s;
  }
  const sec=(o,fields)=>fields.filter(f=>f.k!=='name'&&o[f.k]).map(f=>`**${f.l}**  \n${o[f.k]}\n`).join('\n');
  let s=`# ${t}: verhaalbijbel\n\n`;
  if(b.logline) s+=`## Logline\n\n${b.logline}\n\n`;
  if(b.theme) s+=`## Thema\n\n${b.theme}\n\n`;
  if(b.synopsis) s+=`## Synopsis\n\n${b.synopsis}\n\n`;
  const beats=[...(b.beats||[])].sort((a,c)=>a.pct-c.pct);
  if(beats.length){ s+=`## Plot (${STRUCTURES[b.structure]?.name||'eigen structuur'})\n\n`;
    beats.forEach(x=>{ const ci=S.chapters.findIndex(c=>c.id===x.chapterId); s+=`### ${x.name} (${x.pct}%)${ci>=0?` · hoofdstuk ${ci+1}`:''}\n\n${x.notes||'_nog niet ingevuld_'}\n\n`; }); }
  if(S.chapters.length){ s+=`## Hoofdstukken\n\n`; S.chapters.forEach((c,i)=>{ s+=`${i+1}. **${c.title||'Zonder titel'}** (${c.status||'Idee'}, ${c.words||0} woorden)${c.synopsis?`: ${c.synopsis}`:''}\n`; }); s+='\n'; }
  if(S.characters.length){ s+=`## Personages\n\n`; S.characters.forEach(c=>{ s+=`### ${c.name||'Naamloos'}\n\n${sec(c,CHAR_FIELDS)}\n`; }); }
  if(S.places.length){ s+=`## Wereld\n\n`; S.places.forEach(p=>{ s+=`### ${p.name||'Naamloos'}\n\n${sec(p,PLACE_FIELDS)}\n`; }); }
  return s;
}

/* ================= schrijfsessies ================= */
const SESS_KEY='schrijfkamer:session';
const pad=n=>String(n).padStart(2,'0');
const TF=new Intl.DateTimeFormat('nl-BE',{hour:'2-digit',minute:'2-digit'});
const SF=new Intl.DateTimeFormat('nl-BE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
let sessTimer=null;
// de lopende sessie is een gemak per browser: ze wordt pas in je account bewaard als je ze afrondt
function loadSession(){ try{ const x=JSON.parse(localStorage.getItem(SESS_KEY)||'null'); if(x&&x.bookId&&x.start) S.session=x; }catch(e){} ensureSessTimer(); }
function storeSession(){ try{ S.session?localStorage.setItem(SESS_KEY,JSON.stringify(S.session)):localStorage.removeItem(SESS_KEY); }catch(e){} ensureSessTimer(); }
function ensureSessTimer(){
  const run=!!(S.session&&!S.session.end);
  if(run&&!sessTimer) sessTimer=setInterval(tickSession,1000);
  if(!run&&sessTimer){ clearInterval(sessTimer); sessTimer=null; }
}
const mySession=()=>S.session&&S.session.bookId===S.activeId?S.session:null;
function sessionButton(){
  const s=mySession();
  if(!s){
    if(S.session) toast('De sessie in je andere boek is gestopt zonder te bewaren.');
    S.session={bookId:S.activeId,start:Date.now(),end:null,words:0,chapters:[]}; storeSession(); refreshSessionUi();
    if(S.view!=='manuscript') toast('Sessie gestart. Elk woord dat je typt telt mee.');
    return;
  }
  if(!s.end){ s.end=Date.now(); storeSession(); refreshSessionUi(); }
  openReflection(false);
}
function refreshSessionUi(){
  const s=mySession(), box=$('#sessbox');
  if(box) box.innerHTML=!s?`<button class="btn" data-act="session">Start schrijfsessie</button>`
    :s.end?`<span>Sessie gestopt · ${nf(s.words)} woorden</span><button class="btn primary sm" data-act="session">Sessie afronden</button>`
    :`<span class="sessclock"></span><button class="btn sm" data-act="session">Stop sessie</button>`;
  const btn=$('#sessBtn'); if(btn) btn.textContent=!s?'Start sessie':s.end?'Sessie afronden':'Stop sessie';
  if(!s||s.end) document.querySelectorAll('#main .sessclock').forEach(e=>e.textContent='');
  tickSession();
}
function tickSession(){
  const s=mySession(); if(!s||s.end) return;
  const ms=Date.now()-s.start, h=Math.floor(ms/3600000), m=Math.floor(ms/60000)%60, sec=Math.floor(ms/1000)%60;
  const wph=ms>=120000?Math.round(s.words/(ms/3600000)):0;
  const txt=`Sessie ${h?h+':'+pad(m):m}:${pad(sec)} · +${nf(s.words)}${wph?` · ${nf(wph)} w/u`:''}`;
  document.querySelectorAll('.sessclock').forEach(e=>e.textContent=txt);
}
function openReflection(manual){
  const s=manual?null:mySession(); if(!manual&&!s) return;
  const minutes=s?Math.max(1,Math.round((s.end-s.start)/60000)):30;
  openModal(`<h2 id="mt">${manual?'Sessie toevoegen':'Sessie afgerond'}</h2>
    <p class="muted">${manual?'Schreef je op papier of in een ander programma? Vul je woorden en tijd in; de app berekent je tempo.':`${esc(SF.format(new Date(s.start)))} tot ${esc(TF.format(new Date(s.end)))}. Pas de cijfers aan als je ook ergens anders schreef.`}</p>
    <div class="form">
      ${manual?`<div class="field half"><label for="rf-date">Datum</label><input id="rf-date" type="date" value="${todayKey()}"></div>`:''}
      <div class="field half"><label for="rf-type">Soort werk</label><select id="rf-type">${SESSION_TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div>
      <div class="field half"><label for="rf-min">Minuten</label><input id="rf-min" type="number" min="1" inputmode="numeric" value="${minutes}"></div>
      <div class="field half"><label for="rf-words">Woorden</label><input id="rf-words" type="number" min="0" inputmode="numeric" value="${s?s.words:''}"></div>
      <div class="field half"><span style="font-size:13px;font-weight:600">Tempo</span><output id="rf-wph" class="rf-wph" for="rf-min rf-words">–</output></div>
      <div class="field"><span style="font-size:13px;font-weight:600">Hoe ging het?</span><div class="moods" role="radiogroup" aria-label="Hoe ging het?">${MOODS.map((l,i)=>`<label><input type="radio" name="rf-mood" value="${i+1}"><span>${l}</span></label>`).join('')}</div></div>
      <div class="field"><label for="rf-worked">Wat werkte er?</label><textarea id="rf-worked" rows="2"></textarea></div>
      <div class="field"><label for="rf-stuck">Waar liep je vast?</label><textarea id="rf-stuck" rows="2"></textarea></div>
      <div class="field"><label for="rf-next">Waar begin je de volgende keer?</label><p class="hint">Eén concrete zin. Je ziet hem terug op het overzicht.</p><textarea id="rf-next" rows="2"></textarea></div>
      ${manual?`<label class="tick field"><input type="checkbox" id="rf-log" checked> Tel deze woorden mee in mijn dagtotaal</label>`:''}
    </div>
    <div class="row">${manual?'':`<button class="btn danger" data-act="discardSession" data-confirm="Zeker? Klik opnieuw">Niet bewaren</button>`}<span class="spacer"></span>
      <button class="btn" data-act="closeModal">${manual?'Annuleer':'Later'}</button><button class="btn primary" data-act="saveSession" data-manual="${manual?'1':''}">Bewaar sessie</button></div>`);
  updateWph();
  if(!manual) $('#rf-worked')?.focus();
}
function updateWph(){
  const m=Number($('#rf-min')?.value)||0, w=Number($('#rf-words')?.value)||0, o=$('#rf-wph');
  if(o) o.textContent=m>0?`${nf(w/(m/60))} w/u`:'–';
}
function saveSession(manual){
  const b=book(); if(!b) return;
  const minutes=Math.max(1,Math.round(Number($('#rf-min').value)||1)), words=Math.max(0,Math.round(Number($('#rf-words').value)||0));
  const mood=Number(document.querySelector('input[name=rf-mood]:checked')?.value)||0;
  let start,end,chapters=[];
  if(manual){
    const d=$('#rf-date').value||todayKey();
    start=new Date(d+'T12:00:00').getTime(); end=start+minutes*60000;
    if($('#rf-log').checked&&words){ b.log=b.log||{}; b.log[d]=(b.log[d]||0)+words; saveBook(b,0); }
  } else {
    const s=mySession(); if(!s) return;
    start=s.start; end=s.end; chapters=s.chapters;
  }
  const x={id:newId(),type:$('#rf-type').value||'Schrijven',start,end,minutes,words,wph:Math.round(words/(minutes/60)),chapters,mood,
    worked:$('#rf-worked').value.trim(),stuck:$('#rf-stuck').value.trim(),next:$('#rf-next').value.trim(),manual,created:Date.now()};
  S.sessions.push(x); saveEnt('sessions',x,0);
  if(!manual){ S.session=null; storeSession(); }
  render();
  if(aiOn()) openFeedback(x.id,true);
  else { closeModal(); toast(isWriting(x)?`Sessie bewaard: ${nf(x.wph)} woorden per uur`:'Sessie bewaard'); }
}
const isWriting=x=>!x.type||x.type==='Schrijven';
const fmtMin=m=>`${Math.floor(m/60)}u ${pad(m%60)}`;
function sessionsFrom(){
  const d=startOfToday(), f=S.sessFilter;
  if(f==='Deze week'){ d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime(); }
  if(f==='Deze maand'){ d.setDate(1); return d.getTime(); }
  return 0;
}
function vSessions(){
  const all=[...S.sessions].sort((a,c)=>(c.start||0)-(a.start||0));
  const filt=`<span class="seg" role="group" aria-label="Periode">${['Deze week','Deze maand','Alles'].map(v=>`<button data-act="sessFilter" data-v="${v}" class="${S.sessFilter===v?'on':''}" aria-pressed="${S.sessFilter===v}">${v}</button>`).join('')}</span>`;
  const head=`<h2>Werksessies<span class="row">${all.length?filt:''}<button class="btn sm" data-act="addSession">+ Sessie toevoegen</button></span></h2>`;
  if(!all.length) return `<section class="panel" style="margin-bottom:16px">${head}
    <p class="muted">Nog geen sessies. Start er een in de zijbalk of bij Manuscript; na afloop zie je je woorden per uur en blik je kort terug. Werkte je ergens anders, voeg je sessie dan hier toe.</p></section>`;
  const from=sessionsFrom(), ss=all.filter(x=>(x.start||0)>=from), wr=ss.filter(isWriting);
  const mins=ss.reduce((t,x)=>t+(x.minutes||0),0);
  const wm=wr.reduce((t,x)=>t+(x.minutes||0),0), ww=wr.reduce((t,x)=>t+(x.words||0),0);
  const best=wr.reduce((m,x)=>Math.max(m,x.wph||0),0);
  const perType=SESSION_TYPES.map(t=>[t,ss.filter(x=>(x.type||'Schrijven')===t).reduce((a,x)=>a+(x.minutes||0),0)]).filter(x=>x[1]);
  const auto=all.filter(x=>!x.manual&&x.minutes>=5&&isWriting(x));
  const tod=[['Ochtend',5,12],['Middag',12,18],['Avond',18,24],['Nacht',0,5]].map(([l,a,z])=>{
    const xs=auto.filter(x=>{ const h=new Date(x.start).getHours(); return h>=a&&h<z; });
    const w=xs.reduce((t,x)=>t+x.words,0), m=xs.reduce((t,x)=>t+x.minutes,0);
    return {l,n:xs.length,wph:m?w/(m/60):0}; }).filter(x=>x.n);
  const maxT=Math.max(1,...tod.map(x=>x.wph));
  const stuck=all.filter(x=>x.stuck).slice(0,4);
  return `<section class="panel" style="margin-bottom:16px">${head}
    <div class="sstats">
      <div><span class="k">Sessies</span><b>${ss.length}</b></div>
      <div><span class="k">Tijd</span><b>${fmtMin(mins)}</b></div>
      <div><span class="k">Schrijftempo</span><b>${nf(wm?ww/(wm/60):0)} w/u</b></div>
      <div><span class="k">Snelste schrijfsessie</span><b>${nf(best)} w/u</b></div>
    </div>
    ${perType.length>1?`<p class="typeline">${perType.map(([t,m])=>`<span class="chip">${t} · ${fmtMin(m)}</span>`).join('')}</p>`:''}
    <div class="grid2">
      <div style="min-width:0">${ss.length?ss.slice(0,15).map(x=>`<details class="sess"><summary>
        <span>${esc(x.manual?DF.format(new Date(x.start)):SF.format(new Date(x.start)))}</span>
        <span class="num sm-hide">${x.minutes} min</span><span class="num">${nf(x.words)} w</span><span class="num sw">${isWriting(x)?`${nf(x.wph)} w/u`:'–'}</span>
        <span class="sm-hide"><span class="chip ${isWriting(x)?'blue':''}">${esc(x.type||'Schrijven')}</span></span></summary>
        <div class="refl">${x.mood?`<p><b>Hoe het ging:</b> ${MOODS[x.mood-1]}</p>`:''}${x.worked?`<p><b>Werkte:</b> ${esc(x.worked)}</p>`:''}${x.stuck?`<p><b>Liep vast:</b> ${esc(x.stuck)}</p>`:''}${x.next?`<p><b>Volgende keer:</b> ${esc(x.next)}</p>`:''}
          ${!x.worked&&!x.stuck&&!x.next?'<p class="faint">Geen terugblik ingevuld.</p>':''}
          ${x.feedback?`<p><b>Feedback van Claude:</b> ${esc(x.feedback.werkpunt||x.feedback.proces)}</p><button class="btn sm" data-act="fbOpen" data-id="${esc(x.id)}">Lees de feedback</button>`
            :aiOn()?`<button class="btn ai sm" data-act="fbOpen" data-id="${esc(x.id)}">Vraag feedback van Claude</button>`:''}
          <button class="btn ghost sm danger" data-act="delSession" data-id="${esc(x.id)}" data-confirm="Zeker?">Verwijder sessie</button></div></details>`).join('')
        :`<p class="muted">Geen sessies in deze periode.</p>`}</div>
      <div class="stack">
        <div><p class="subh">Wanneer je het vlotst schrijft</p>
          ${auto.length>=3?`<div class="chbars">${tod.map(x=>`<div class="chbar"><span class="t">${x.l}</span><span class="meter"><i style="width:${x.wph/maxT*100}%"></i></span><span class="n">${nf(x.wph)} w/u</span></div>`).join('')}</div>`
          :`<p class="muted" style="font-size:13.5px">Na drie schrijfsessies van minstens vijf minuten zie je hier op welk moment van de dag je het snelst schrijft.</p>`}</div>
        <div><p class="subh">Waar je vastliep</p>
          ${stuck.length?`<ul class="stuck">${stuck.map(x=>`<li><span>${esc(x.stuck)}</span><span class="faint">${esc(DF.format(new Date(x.start)))}</span></li>`).join('')}</ul>`
          :`<p class="muted" style="font-size:13.5px">Nog niets genoteerd.</p>`}</div>
      </div>
    </div></section>`;
}

/* ================= wat schrijf ik hierna? ================= */
const cut=(t,n)=>{ t=String(t||'').trim(); return t.length>n?t.slice(0,n)+'…':t; };
const tail=(t,n)=>{ t=String(t||'').trim(); return t.length>n?'…'+t.slice(-n):t; };
function buildNextPrompt(fromId,ask){
  const b=book(), chs=S.chapters, idx=chs.findIndex(c=>c.id===fromId), cur=chs[idx];
  const who=id=>S.characters.find(c=>c.id===id)?.name||'';
  const upto=chs.slice(0,idx+1).reduce((t,c)=>t+(c.words||0),0);
  const L=[];
  L.push('Je bent een ervaren redacteur en schrijfcoach. Een romanschrijver vraagt je: "Wat schrijf ik hierna?"',
    'Hieronder staat alles wat de schrijver over het boek heeft vastgelegd. Ga daarvan uit en spreek het niet tegen.','');
  L.push('## Boek',`Titel: ${b.title||'-'}`,`Genre: ${b.genre||'-'}`,`Taal van het boek: ${langName(bookLang(b))}`,`Logline: ${cut(b.logline,600)||'-'}`,`Thema: ${cut(b.theme,400)||'-'}`,
    `Synopsis: ${cut(b.synopsis,3000)||'-'}`,`Beoogde lengte: ${b.targetWords||'?'} woorden. Tot en met het vertrekpunt zijn ${upto} woorden geschreven (${b.targetWords?Math.round(upto/b.targetWords*100):'?'}% van de beoogde lengte).`,'');
  const beats=[...(b.beats||[])].sort((a,c)=>(a.pct||0)-(c.pct||0));
  if(beats.length){
    L.push(`## Plotstructuur: ${STRUCTURES[b.structure]?.name||'eigen structuur'}`);
    beats.forEach(x=>{ const ci=chs.findIndex(c=>c.id===x.chapterId);
      L.push(`- ${x.name} (rond ${x.pct}%)${ci>=0?` – gekoppeld aan hoofdstuk ${ci+1}${ci<=idx?' (al geschreven of gepland vóór het vertrekpunt)':''}`:' – nog niet gekoppeld'}${x.notes?`: ${cut(x.notes,400)}`:''}`); });
    L.push('');
  }
  if(chs.length){
    L.push('## Hoofdstukken');
    chs.forEach((c,i)=>L.push(`${i+1}. ${c.title||'Zonder titel'} [${c.status||'Idee'}, ${c.words||0} woorden${c.pov?`, perspectief: ${who(c.pov)}`:''}]${c.synopsis?` – ${cut(c.synopsis,500)}`:''}${i===idx?'  ← VERTREKPUNT':''}${(c.scenes||[]).length?` | scènes: ${c.scenes.map(x=>(x.done?'✓ ':'')+(x.title||'?')).join('; ')}`:''}`));
    L.push('');
  }
  if(cur){
    L.push(`## Slot van hoofdstuk ${idx+1} (${cur.title||'zonder titel'})`, tail(cur.text,6000)||'(nog geen tekst, alleen de samenvatting)','');
    if((cur.text||'').length<1500 && idx>0) L.push(`## Slot van hoofdstuk ${idx}`, tail(chs[idx-1].text,2500)||'(geen tekst)','');
  }
  if(S.characters.length){
    L.push('## Personages');
    S.characters.slice(0,20).forEach(c=>L.push(`- ${c.name||'Naamloos'} (${c.role||'-'})${[['wil',c.want],['heeft nodig',c.need],['zwakte',c.flaw],['ontwikkeling',c.arc]].filter(x=>x[1]).map(([k,v])=>`; ${k}: ${cut(v,300)}`).join('')}`));
    L.push('');
  }
  if(S.places.length){
    L.push('## Wereld');
    S.places.slice(0,20).forEach(p=>L.push(`- ${p.name||'Naamloos'} (${p.type||'-'}): ${cut([p.summary,p.details].filter(Boolean).join(' '),400)}`));
    L.push('');
  }
  const open=S.notes.filter(n=>!n.done&&n.text).sort((a,c)=>(c.created||0)-(a.created||0)).slice(0,15);
  if(open.length){ L.push('## Open ideeën en vragen van de schrijver'); open.forEach(n=>L.push(`- [${n.type}] ${cut(n.text,300)}`)); L.push(''); }
  const ls=[...S.sessions].sort((a,c)=>(c.end||0)-(a.end||0))[0];
  if(ls&&(ls.stuck||ls.next)){ L.push('## Laatste schrijfsessie'); if(ls.stuck) L.push(`Liep vast op: ${cut(ls.stuck,400)}`); if(ls.next) L.push(`Wilde de volgende keer beginnen met: ${cut(ls.next,400)}`); L.push(''); }
  if(ask) L.push('## Vraag van de schrijver', cut(ask,1000), '');
  L.push('## Opdracht',
    `Doe drie concrete, duidelijk verschillende voorstellen voor de eerstvolgende scène ${cur?`na hoofdstuk ${idx+1}`:'aan het begin van het boek'}. Elk voorstel:`,

/* ================= back-up ================= */
async function blobToB64(b){ const buf=new Uint8Array(await b.arrayBuffer()); let s=''; for(let i=0;i<buf.length;i+=0x8000) s+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000)); return btoa(s); }
function b64ToBlob(b64,type){ const bin=atob(b64), a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type}); }
function assetIdsOf(d){
  const out=[]; if(!d) return out;
  ['img','cover'].forEach(k=>{ if(imgUrl(d[k])) out.push(d[k]); });
  Object.values(d.banners||{}).forEach(v=>{ if(imgUrl(v)) out.push(v); });
  (d.assets||[]).forEach(a=>{ if(imgUrl(a.img)) out.push(a.img); });
  return out;
}
async function buildBackup(){
  flushAll();
  const books=[], ids=new Set();
  for(const b of S.books){
    const entry={book:structuredClone(b)}; assetIdsOf(b).forEach(i=>ids.add(i));
    for(const k of KINDS){
      const col=P.col(b.id,k);
      entry[k]=mergeRows(await store.getAll(col),col).map(d=>structuredClone(d));
      entry[k].forEach(d=>assetIdsOf(d).forEach(i=>ids.add(i)));
    }
    books.push(entry);
  }
  const brand=structuredClone(S.brand); assetIdsOf(brand).forEach(i=>ids.add(i));
  const out={};
  for(const id of ids){
    try{ const r=await fetch(imgUrl(id)); if(!r.ok) continue; const bl=await r.blob(); out[id]={type:bl.type||'image/webp',data:await blobToB64(bl)}; }catch(e){}
  }
  return {format:'schrijfkamer-backup',version:1,exportedAt:new Date().toISOString(),books,author:{brand,ledger:structuredClone(S.ledger)},assets:out};
}
async function exportBackup(){
  if(!downloads){ toast('Exporteren kan niet in deze weergave.'); return; }
  toast('Back-up wordt samengesteld…');
  try{
    const data=JSON.stringify(await buildBackup());
    await downloads.save({filename:`schrijfkamer-back-up-${todayKey()}.json`,data});
    toast('Back-up bewaard');
  }catch(e){ if(e&&e.code==='declined') return; toast('De back-up kon niet worden bewaard.'); }
}
async function restoreBackup(bk){
  if(!bk||bk.format!=='schrijfkamer-backup'||!Array.isArray(bk.books)) throw {userMsg:'Dit bestand is geen geldige Schrijfkamer-back-up.'};
  toast('Back-up wordt geïmporteerd…');
  const map={}; let lostImgs=0;
  for(const [id,a] of Object.entries(bk.assets||{})){
    if(!assets){ lostImgs++; continue; }
    try{ const r=await assets.upload(b64ToBlob(a.data,a.type||'image/webp')); map[id]=r.id; }catch(e){ lostImgs++; }
  }
  const fix=d=>{
    ['img','cover'].forEach(k=>{ if(d[k]) d[k]=map[d[k]]||''; });
    if(d.banners){ const nb={}; for(const k in d.banners){ if(map[d.banners[k]]) nb[k]=map[d.banners[k]]; } d.banners=nb; }
    if(Array.isArray(d.assets)) d.assets=d.assets.filter(a=>map[a.img]).map(a=>Object.assign(a,{img:map[a.img]}));
    return d;
  };
  let first=null, n=0;
  for(const entry of bk.books){
    if(!entry||!entry.book) continue;
    const exists=S.books.some(x=>x.id===entry.book.id);
    const bid=exists?newId():entry.book.id;
    const b=fix(Object.assign(structuredClone(entry.book),{id:bid}));
    if(exists) b.title=(b.title||'Naamloos boek')+' (kopie)';
    if(!S.books.find(x=>x.id===bid)) S.books.push(b);
    await writeNow(P.book(bid),b);
    for(const k of KINDS){
      const rows=(entry[k]||[]).filter(d=>d&&d.id).map(d=>fix(structuredClone(d)));
      for(let i=0;i<rows.length;i+=8) await Promise.all(rows.slice(i,i+8).map(d=>store.set(P.col(bid,k)+'/'+d.id,d)));
    }
    first=first||bid; n++;
  }
  const a=bk.author||{};
  if(a.brand){
    const B=S.brand, empty=!B.name&&!B.bio&&!B.tagline&&!(B.colors||[]).length&&!(B.assets||[]).length;
    const nb=fix(structuredClone(a.brand)); delete nb.id;
    if(empty) S.brand=Object.assign({name:'',bio:'',tagline:'',colors:[],assets:[]},nb);
    else { const has=new Set([...(B.colors||[]),...(B.assets||[])].map(x=>x.id));
      B.colors=[...(B.colors||[]),...(nb.colors||[]).filter(x=>!has.has(x.id))]; B.assets=[...(B.assets||[]),...(nb.assets||[]).filter(x=>!has.has(x.id))]; }
    saveBrand(0);
  }
  const known=new Set(S.ledger.map(e=>e.id));
  for(const e of (a.ledger||[])) if(e&&e.id&&!known.has(e.id)){ S.ledger.push(e); queue(P.ledger()+'/'+e.id,e,0); }
  closeModal();
  if(first){ S.view='overzicht'; prefs.view='overzicht'; selectBook(first); }
  toast(`${n} ${n===1?'boek':'boeken'} geïmporteerd${lostImgs?`; ${lostImgs} afbeelding(en) konden niet mee`:''}`);
}

// verkleint naar een redelijke maat zodat foto's van je telefoon de opslag niet opsouperen
async function shrinkImage(file,max){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height)), w=Math.round(bmp.width*k), h=Math.round(bmp.height*k);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
  const g=cv.getContext('2d'); g.drawImage(bmp,0,0,w,h); bmp.close&&bmp.close();
  let blob=await new Promise(r=>cv.toBlob(r,'image/webp',.86));
  if(!blob||blob.type!=='image/webp'){
    g.globalCompositeOperation='destination-over'; g.fillStyle='#ffffff'; g.fillRect(0,0,w,h);
    blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.86));
  }
  return blob;
}
const imgOwner=t=>t.kind==='book'?(S.activeId===t.id?book():null):t.kind==='banner'?book():t.kind==='brandasset'?S.brand:(S[t.kind]||[]).find(x=>x.id===t.id);
function saveOwner(t,o){ if(t.kind==='book'||t.kind==='banner') saveBook(o,0); else if(t.kind==='brandasset') saveBrand(0); else saveEnt(t.kind,o,0); }
// gedeelde afbeeldingen (overgenomen in een ander boek, of een ontwerp dat als omslag dient) worden nooit gewist
const sharedFlag=t=>t.kind==='banner'?null:t.field==='img'?'imgShared':t.field+'Shared';
function imgGet(t,o){ return t.kind==='banner'?(o.banners||{})[t.id]:o[t.field]; }
function imgSet(t,o,id){
  if(t.kind==='banner'){ o.banners=Object.assign({},o.banners); if(id) o.banners[t.id]=id; else delete o.banners[t.id]; }
  else { o[t.field]=id; const f=sharedFlag(t); if(f) o[f]=false; }
}
function dropAsset(id){ if(assets&&imgUrl(id)) assets.delete(id).catch(()=>{}); }
async function uploadImage(file){
  const t=S.pickFor; S.pickFor=null; if(!t||!assets) return;
  const bookId=S.activeId;
  S.uploading=t.kind+':'+t.id; renderMain();
  try{
    let blob; try{ blob=await shrinkImage(file,t.kind==='banner'?2000:t.kind==='book'?1600:1200); }catch(e){ throw {code:'decode'}; }
    let r; try{ r=await assets.upload(blob); }
    catch(e){ if(e&&e.code==='store_unavailable'){ await new Promise(z=>setTimeout(z,800)); r=await assets.upload(blob); } else throw e; }
    if(t.kind==='brandasset'){ S.brand.assets=S.brand.assets||[]; S.brand.assets.push({id:newId(),img:r.id,label:''}); saveBrand(0); return; }
    const o=S.activeId===bookId?imgOwner(t):null;
    if(!o){ dropAsset(r.id); return; }
    const old=imgGet(t,o), wasShared=sharedFlag(t)&&o[sharedFlag(t)];
    imgSet(t,o,r.id); saveOwner(t,o);
    if(old&&old!==r.id&&!wasShared) dropAsset(old);
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed'){ assets=null; toast('Afbeeldingen toevoegen kan niet in deze weergave.'); }
    else toast(IMG_ERR[c]||'Uploaden is mislukt. Probeer het opnieuw.');
  }finally{ S.uploading=null; render(); }
}
function removeImage(kind,id,field){
  const t={kind,id,field};
  if(kind==='brandasset'){ const a=(S.brand.assets||[]).find(x=>x.id===id); if(!a) return; S.brand.assets=S.brand.assets.filter(x=>x!==a); saveBrand(0); dropAsset(a.img); render(); return; }
  const o=imgOwner(t); if(!o) return;
  const old=imgGet(t,o), shared=sharedFlag(t)&&o[sharedFlag(t)];
  imgSet(t,o,''); saveOwner(t,o); if(!shared) dropAsset(old); render();
}

function buildCheckPrompt(c){

  }
  const t=String(c.text||'');
  L.push(`## Te controleren: hoofdstuk ${idx+1}${c.title?` (${c.title})`:''}`, c.synopsis?`Samenvatting volgens de schrijver: ${cut(c.synopsis,600)}`:'',
    t.length>90000?t.slice(0,90000)+'\n[… de rest van het hoofdstuk is weggelaten]':t,'');
  L.push('## Opdracht',
    'Meld alleen echte tegenstrijdigheden en continuïteitsfouten: uiterlijk, leeftijd, namen, familie en relaties, wat een personage weet of wil, regels van de wereld, plaatsen, tijdlijn en data, en gebeurtenissen die botsen met eerdere hoofdstukken of met de synopsis.',
    'Meld geen stijl, smaak of schrijfadvies. Verzin geen problemen; als er niets botst, geef je een lege lijst. Een personage dat zich vergist of liegt is geen fout.',

    'Antwoord met alleen JSON in precies deze vorm:',
    '{"samenvatting":"één zin over de continuïteit van dit hoofdstuk","punten":[{"soort":"Personage|Wereld|Tijdlijn|Plot|Overig","ernst":"hoog|middel|laag","citaat":"letterlijke, korte passage uit het hoofdstuk (hooguit 15 woorden, exact overgenomen)","probleem":"wat botst er","bron":"waarmee het botst, bijvoorbeeld de personagekaart van Mira of hoofdstuk 2","suggestie":"hoe je het kunt oplossen, zonder herschreven tekst"}],"nieuw":[{"naam":"naam van het personage of wereldelement","feit":"het nieuwe feit"}]}');
  return L.filter(x=>x!==null).join('\n');

async function runCheck(){
  const C=S.check; if(C.busy||!sample) return;
  const c=S.chapters.find(x=>x.id===S.sel.chapters); if(!c||!c.words) return;
  C.busy=true; C.err=''; C.phase='Claude leest je hoofdstuk naast je verhaalbijbel…';
  const ctl=new AbortController(); C.ctl=ctl; renderCheck();
  try{
    const d=await aiJson(buildCheckPrompt(c),ctl,()=>{ if(!C.phase.startsWith('Claude zet')){ C.phase='Claude zet de bevindingen op een rij…'; renderCheck(); } });
    const rank={hoog:0,middel:1,laag:2};
    C.result={bookId:S.activeId,chapterId:c.id,words:c.words,samenvatting:String(d&&d.samenvatting||''),
      punten:(Array.isArray(d&&d.punten)?d.punten:[]).filter(x=>x&&x.probleem).map(x=>({soort:String(x.soort||'Overig'),ernst:['hoog','middel','laag'].includes(x.ernst)?x.ernst:'middel',

      nieuw:(Array.isArray(d&&d.nieuw)?d.nieuw:[]).filter(x=>x&&x.feit).map(x=>({naam:String(x.naam||''),feit:String(x.feit)})).slice(0,5)};
  }catch(e){ if(e.msg) C.err=e.msg; }
  finally{ C.busy=false; C.ctl=null; renderCheck(); }
}
function matchEntity(name){

  }
  return null;
}
