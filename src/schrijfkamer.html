function buildFeedbackPrompt(x){
  const b=book(), others=S.sessions.filter(y=>y.id!==x.id).sort((a,c)=>(c.start||0)-(a.start||0));
  const wo=others.filter(isWriting), om=wo.reduce((t,y)=>t+(y.minutes||0),0), ow=wo.reduce((t,y)=>t+(y.words||0),0);
  const L=['Je bent een eerlijke, bemoedigende schrijfcoach. Geef kort feedback op één schrijfsessie van een romanschrijver.',''];
  L.push('## Boek',`Titel: ${b.title||'-'}`,`Genre: ${b.genre||'-'}`,`Taal van het boek: ${langName(bookLang(b))}`,`Logline: ${cut(b.logline,500)||'-'}`,'');
  L.push('## Deze sessie',`Soort werk: ${x.type||'Schrijven'}.${isWriting(x)?'':' Bij dit soort werk zegt het aantal woorden weinig; beoordeel het tempo niet.'}`,
    `${x.minutes} minuten, ${x.words} woorden, ${x.wph} woorden per uur.`,
    wo.length?`Gemiddeld schrijftempo in ${wo.length} eerdere schrijfsessies: ${Math.round(om?ow/(om/60):0)} woorden per uur.`:'Er zijn nog geen eerdere schrijfsessies om mee te vergelijken.',
    x.mood?`Hoe het ging volgens de schrijver: ${MOODS[x.mood-1]}.`:'', x.worked?`Wat werkte: ${cut(x.worked,500)}`:'', x.stuck?`Waar de schrijver vastliep: ${cut(x.stuck,500)}`:'',
    x.next?`Plan voor de volgende keer: ${cut(x.next,300)}`:'','');
  if(others.length){ L.push('## Recente sessies'); others.slice(0,5).forEach(y=>L.push(`- ${DF.format(new Date(y.start))}: ${y.type||'Schrijven'}, ${y.minutes} min, ${y.wph} w/u${y.mood?`, ${MOODS[y.mood-1]}`:''}${y.stuck?`, liep vast op: ${cut(y.stuck,150)}`:''}`)); L.push(''); }
  const cid=[...(x.chapters||[])].reverse().find(id=>S.chapters.some(c=>c.id===id));
  const ch=S.chapters.find(c=>c.id===cid);
  if(ch&&ch.text){
    const k=clamp(x.words||0,300,2000), words=ch.text.trim().split(/\s+/);
    L.push(`## Fragment: slot van hoofdstuk ${S.chapters.indexOf(ch)+1}${ch.title?` (${ch.title})`:''}`,'Dit is het einde van het hoofdstuk waarin de schrijver werkte; het bevat waarschijnlijk het werk van deze sessie.',
      (words.length>k?'… ':'')+words.slice(-k).join(' '),'');
  }
  L.push('## Opdracht',
    ch&&ch.text?'Geef twee concrete dingen die goed werken in het fragment, met een kort citaat als dat helpt.':'Er is geen fragment; geef twee concrete dingen die goed gingen in deze sessie.',
    'Geef één concreet werkpunt voor het fragment (of de sessie), zonder tekst te herschrijven.',
    'Geef één observatie over het schrijfproces (tempo, vastlopen, patronen over sessies heen) met een praktische tip.',
    'Geef één concrete opdracht om de volgende sessie mee te beginnen.',
    'Geen holle complimenten. Schrijf in het Nederlands, kort en direct.',
    'Antwoord met alleen JSON in precies deze vorm: {"sterk":["…","…"],"werkpunt":"…","proces":"…","volgende":"…"}');
  return L.filter(Boolean).join('\n');
}
async function runFeedback(){
  const F=S.fb; if(F.busy||!sample) return;
  const x=S.sessions.find(y=>y.id===F.id); if(!x) return;

/* ================= zoeken en vervangen ================= */
// Velden met id's, keuzelijsten of tellers worden nooit aangeraakt.
const FR_SKIP=new Set(['id','pov','place','chapterId','img','cover','banners','created','updated','status','structure','type','role','importance','kind','src','order','words','done','pct','log','checklist','start','end','rwRef','rwDone','rwBase','at']);
const FR_SCOPES=[['manuscript','Manuscript'],['entities','Personages en wereld'],['plot','Plot, boekgegevens en marketing'],['ideas','Ideeën, research en sessies']];
function frRegex(q,F){
  const src=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp(F.word?`(?<![\\p{L}\\p{N}_])${src}(?![\\p{L}\\p{N}_])`:src,'gu'+(F.cs?'':'i'));
}
// Zonder hoofdlettergevoeligheid volgt de vervanging de vorm van wat er stond: RUTH → SARAH, Ruth → Sarah.
function frFit(m,r){
  if(!r) return r;
  if(m.length>1&&m===m.toUpperCase()&&m!==m.toLowerCase()) return r.toUpperCase();
  if(m[0]!==m[0].toLowerCase()) return r[0].toUpperCase()+r.slice(1);
  return r;
}
function frWalk(o,fn){
  let changed=false;
  for(const k of Object.keys(o)){
    if(FR_SKIP.has(k)) continue;
    const v=o[k];
    if(typeof v==='string'){ const n=fn(v); if(n!==undefined&&n!==v){ o[k]=n; changed=true; } }
    else if(v&&typeof v==='object'&&frWalk(v,fn)) changed=true;
  }
  return changed;
}
function frTargets(sc){
  const out=[], lab=d=>d.title||d.name||d.label||cut(d.text||d.reflectie||'',40)||'Zonder titel';
  const add=(kind,f)=>S[kind].forEach(d=>out.push({kind,doc:d,label:f(d)}));
  if(sc.manuscript) add('chapters',d=>`Hoofdstuk ${S.chapters.indexOf(d)+1}${d.title?': '+d.title:''}`);
  if(sc.entities){ add('characters',d=>'Personage: '+(d.name||'naamloos')); add('places',d=>'Wereld: '+(d.name||'naamloos')); }
  if(sc.plot&&book()) out.push({kind:'book',doc:book(),label:'Plot en boekgegevens'});
  if(sc.ideas){ add('notes',d=>'Idee: '+lab(d)); add('research',d=>'Research: '+lab(d)); add('sessions',d=>'Sessie: '+lab(d)); add('designs',d=>'Ontwerp: '+lab(d)); }
  return out;
}
function frRead(){
  const F=S.fr, v=id=>document.getElementById(id);
  if(!v('fr-q')) return;
  F.q=v('fr-q').value; F.r=v('fr-r').value; F.word=v('fr-word').checked; F.cs=v('fr-cs').checked;
  FR_SCOPES.forEach(([k])=>F.scope[k]=v('fr-s-'+k).checked);
}
function frScan(){
  const F=S.fr; F.hits=[]; F.total=0;
  if(!F.q) return;
  const re=frRegex(F.q,F);
  for(const t of frTargets(F.scope)){
    let n=0, snip=null;
    frWalk(t.doc,v=>{
      for(const m of v.matchAll(re)){
        n++;
        if(!snip){ const a=m.index, z=a+m[0].length; snip=[(a>45?'…':'')+v.slice(Math.max(0,a-45),a),m[0],v.slice(z,z+45)+(z+45<v.length?'…':'')]; }
      }
    });
    if(n){ F.hits.push({label:t.label,n,snip}); F.total+=n; }
  }
}
function renderFr(){
  const F=S.fr, out=$('#fr-out'), go=$('#fr-go'); if(!out) return;
  go.disabled=!F.total; go.textContent=F.total?`${F.r?'Vervang':'Verwijder'} alle ${nf(F.total)}`:'Vervang alle';
  go.dataset.confirm=`Echt alle ${nf(F.total)} verwijderen?`;
  const done=F.undo?`<div class="row" style="margin-bottom:10px"><span style="color:var(--ok)">${nf(F.undo.n)} keer “${esc(F.undo.q)}” vervangen door “${esc(F.undo.r)}”.</span><span class="spacer"></span><button class="btn sm" data-act="frUndo">Maak ongedaan</button></div>`:'';
  if(!F.q){ out.innerHTML=done+'<p class="muted" style="font-size:13.5px">Typ wat je zoekt. Je ziet eerst alle treffers; er verandert pas iets als je op Vervang klikt.</p>'; return; }
  if(!F.total){ out.innerHTML=done+`<p class="muted" style="font-size:13.5px">Geen treffers voor “${esc(F.q)}”.</p>`; return; }
  out.innerHTML=done+`<p class="muted" style="font-size:13.5px;margin:0 0 8px">${nf(F.total)} ${F.total===1?'treffer':'treffers'} in ${F.hits.length} ${F.hits.length===1?'onderdeel':'onderdelen'}:</p>
    <ul class="frlist">${F.hits.map(h=>`<li><b>${esc(h.label)}<span>${h.n}×</span></b><span class="ctx">${esc(h.snip[0])}<mark>${esc(h.snip[1])}</mark>${esc(h.snip[2])}</span></li>`).join('')}</ul>`;
}
function openFr(){
  if(!book()) return;
  const a=document.activeElement; let pre='';
  if(a&&a.matches&&a.matches('#main textarea,#main input[type="text"]')&&a.selectionEnd>a.selectionStart) pre=a.value.slice(a.selectionStart,a.selectionEnd).trim().slice(0,80);
  flushAll();
  S.fr=Object.assign({q:'',r:'',word:true,cs:true,scope:{manuscript:true,entities:true,plot:true,ideas:true}},S.fr||{},{hits:[],total:0,undo:null});
  if(pre) S.fr.q=pre;
  const F=S.fr;
  openModal(`<h2 id="mt">Zoek en vervang</h2>
    <p class="muted" style="font-size:13.5px;margin-top:-6px">In “${esc(book().title||'je boek')}”. Andere boeken blijven ongemoeid.</p>
    <div class="form">
      <div class="field half"><label for="fr-q">Zoek</label><input id="fr-q" type="text" autocomplete="off" spellcheck="false" value="${esc(F.q)}" placeholder="bijvoorbeeld Ruth"></div>
      <div class="field half"><label for="fr-r">Vervang door</label><input id="fr-r" type="text" autocomplete="off" spellcheck="false" value="${esc(F.r)}"></div>
    </div>
    <div class="row" style="gap:16px">
      <label class="tick"><input type="checkbox" id="fr-word" ${F.word?'checked':''}> Alleen hele woorden <span class="faint">(niet “truth” bij “ruth”)</span></label>
      <label class="tick"><input type="checkbox" id="fr-cs" ${F.cs?'checked':''}> Hoofdlettergevoelig</label>
    </div>
    <div class="row" style="gap:16px"><span class="lbl" style="margin:0">Zoek in</span>${FR_SCOPES.map(([k,l])=>`<label class="tick"><input type="checkbox" id="fr-s-${k}" ${F.scope[k]?'checked':''}> ${l}</label>`).join('')}</div>
    <div id="fr-out"></div>
    <div class="row"><span class="faint" style="font-size:12.5px">Sneltoets: Ctrl+H</span><span class="spacer"></span><button class="btn" data-act="closeModal">Sluit</button><button class="btn primary" data-act="frGo" id="fr-go" disabled>Vervang alle</button></div>`,'wide');
  const q=$('#fr-q'); q.focus(); q.select();
  frScan(); renderFr();
}
function frGo(){
  const F=S.fr; frRead(); frScan(); if(!F.total) return;
  const re=frRegex(F.q,F), undo=[]; let n=0;
  for(const t of frTargets(F.scope)){
    const before=structuredClone(t.doc);
    if(!frWalk(t.doc,v=>v.replace(re,m=>{ n++; return F.cs?F.r:frFit(m,F.r); }))) continue;
    undo.push({kind:t.kind,before});
    if(t.kind==='book') saveBook(t.doc,0);
    else { if(t.kind==='chapters'){ t.doc.words=countWords(t.doc.text); t.doc.updated=Date.now(); } saveEnt(t.kind,t.doc,0); }
  }
  F.undo={list:undo,n,q:F.q,r:F.r};
  render(); frScan(); renderFr();
  toast(`${nf(n)} keer vervangen`);
}
function frUndo(){
  const F=S.fr, U=F&&F.undo; if(!U) return;
  for(const {kind,before} of U.list){
    if(kind==='book'){ const i=S.books.findIndex(x=>x.id===before.id); if(i>=0) S.books[i]=before; saveBook(before,0); }
    else { const i=S[kind].findIndex(x=>x.id===before.id); if(i>=0) S[kind][i]=before; saveEnt(kind,before,0); }
  }
  F.undo=null; render(); frScan(); renderFr();
  toast('Vervanging ongedaan gemaakt');
}

/* invoer: elk veld met data-bind schrijft meteen naar de toestand en gebundeld naar de opslag */
function handleBind(el){
  const [kind,id,field]=el.dataset.bind.split(':');
  const v = el.type==='checkbox' ? el.checked : el.type==='number' ? (el.value===''?null:Number(el.value)) : el.value;
  const b=book(); if(!b) return;
  if(kind==='book'){ b[field]=v; saveBook(b); if(field==='lang') applyLang(); if(field==='title') document.querySelectorAll('#bookSel option[value="'+CSS.escape(b.id)+'"]').forEach(o=>o.textContent=v||'Naamloos boek'); return; }
  if(kind==='beat'){ const x=(b.beats||[]).find(y=>y.id===id); if(x){ x[field]=v; saveBook(b); } return; }
  if(kind==='check'){ b.checklist=b.checklist||{}; b.checklist[id]=v; saveBook(b,300); return; }
  if(kind==='mkt'){ b.marketing=Object.assign({},b.marketing,{[id]:v}); saveBook(b); return; }
  if(kind==='brand'){ S.brand[field]=v; saveBrand(); return; }
  if(kind==='basset'){ const a=(S.brand.assets||[]).find(x=>x.id===id); if(a){ a.label=v; saveBrand(); } return; }
  if(kind==='bcolor'){
    const c=(S.brand.colors||[]).find(x=>x.id===id); if(!c) return;
    if(field==='hex'){ let h=String(v||'').trim(); if(h&&h[0]!=='#') h='#'+h; c.hex=h;
      if(/^#[0-9a-f]{6}$/i.test(h)){ const sw=document.getElementById('swc-'+id); if(sw) sw.style.background=h;
        ['swp-','swh-'].forEach(pre=>{ const e=document.getElementById(pre+id); if(e&&e!==el) e.value=h; }); } }
    else c[field]=v;
    saveBrand(); return;
  }
  if(kind==='scene'){
    const ch=S.chapters.find(c=>c.id===S.sel.chapters), sc=ch&&(ch.scenes||[]).find(x=>x.id===id);
    if(sc){ sc[field]=v; ch.updated=Date.now(); saveEnt('chapters',ch); } return;
  }
  const o=(S[kind]||[]).find(x=>x.id===id); if(!o) return;
  if(kind==='chapters'&&field==='text'){ onChapterText(o,v,el); }
  else { o[field]=v; if(kind==='chapters') o.updated=Date.now(); saveEnt(kind,o); }
  const key=`${kind}:${id}:${field}`;
  document.querySelectorAll(`[data-lbl="${CSS.escape(key)}"]`).forEach(n=>n.textContent=v||(kind==='chapters'?'Zonder titel':'Naamloos'));
  if(field==='name') document.querySelectorAll(`[data-lbl-init="${CSS.escape(kind+':'+id)}"]`).forEach(n=>{ if(!n.querySelector('img')) n.textContent=initial(v); });
}
const mainEl=$('#main');
mainEl.addEventListener('input',e=>{
  const el=e.target;
  if(el.matches('textarea.grow')){ const y=scrollY; grow(el); scrollTo(0,y); keepCaretVisible(el); }
  if(el.dataset.bind) handleBind(el);
});

  if(el.dataset.rerender!==undefined){ render(); }
});

document.addEventListener('keydown',e=>{
  if(e.ctrlKey&&!e.altKey&&!e.shiftKey&&e.key.toLowerCase()==='h'&&book()){ e.preventDefault(); openFr(); return; }
  if(e.key!=='Escape') return;
  if(!$('#modal').hidden){ closeModal(); return; }
  if(document.body.classList.contains('focus')){ document.body.classList.remove('focus'); renderMain(); }
});
