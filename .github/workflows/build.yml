name: Windows-installer bouwen

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Schrijfkamer-installer
          path: dist/Schrijfkamer-Setup-*.exe
          if-no-files-found: error
      - name: Release maken
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Schrijfkamer-Setup-*.exe \
            --title "Schrijfkamer ${GITHUB_REF_NAME#v}" \
            --notes "Download **Schrijfkamer-Setup-${GITHUB_REF_NAME#v}.exe** hieronder en dubbelklik. Windows toont waarschijnlijk een blauwe waarschuwing: klik op *Meer informatie* en dan *Toch uitvoeren*. Zie de README voor uitleg."
