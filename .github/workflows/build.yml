name: Windows-installer bouwen

# Elke push naar main bouwt de installer. Staat er in package.json een versie
# waarvoor nog geen release bestaat, dan wordt die release automatisch gemaakt.
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: Controleer dat de CSP-hash klopt (geen CRLF in de pagina)
        shell: bash
        run: node -e "if(require('fs').readFileSync('renderer/index.html','utf8').includes('\r')){console.error('CRLF in renderer/index.html');process.exit(1)}"
      - uses: actions/upload-artifact@v4
        with:
          name: Schrijfkamer-installer
          path: dist/Schrijfkamer-Setup-*.exe
          if-no-files-found: error
      - name: Release maken als deze versie nieuw is
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(node -p "require('./package.json').version")
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "Release v$VER bestaat al; alleen de build-download onder deze run is bijgewerkt."
            exit 0
          fi
          gh release create "v$VER" dist/Schrijfkamer-Setup-*.exe --target "$GITHUB_SHA" \
            --title "Schrijfkamer $VER" \
            --notes "Download **Schrijfkamer-Setup-$VER.exe** hieronder en dubbelklik. Windows toont waarschijnlijk een blauwe waarschuwing: klik op *Meer informatie* en dan *Toch uitvoeren*. Zie de README voor uitleg."
